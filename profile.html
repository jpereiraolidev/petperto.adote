<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil - PetPerto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#EFECE8] text-[#18181B] min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-[420px] min-h-screen sm:min-h-[820px] sm:max-h-[860px] bg-[#F7F6F4] sm:rounded-[42px] shadow-[0_25px_60px_rgba(0,0,0,0.08)] flex flex-col relative overflow-hidden border border-stone-200/70">

    <!-- Topo bege com avatar -->
    <div class="relative bg-[#EAE2D8] pt-7 pb-8 px-6 rounded-b-[36px] shrink-0">
      <!-- Botão voltar -->
      <button onclick="window.location.href='home.html'"
        class="w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm text-zinc-800 flex items-center justify-center shadow-sm cursor-pointer mb-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Avatar + Nome -->
      <div class="flex items-center gap-4">
        <div class="relative">
          <div id="avatarContainer" class="w-20 h-20 rounded-full bg-white flex items-center justify-center text-3xl font-bold text-zinc-800 border-4 border-white shadow-md overflow-hidden">
            <img id="avatarImg" src="" alt="Avatar" class="hidden w-full h-full object-cover">
            <span id="avatarIniciais">🐾</span>
          </div>
          <!-- Botão câmera -->
          <label for="avatarInput" class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#F46A1F] text-white flex items-center justify-center shadow-md cursor-pointer hover:bg-orange-600 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </label>
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
        </div>

        <div class="flex-1 min-w-0">
          <h1 id="perfilNome" class="text-xl font-extrabold text-zinc-900 truncate">Carregando...</h1>
          <p id="perfilEmail" class="text-xs font-medium text-zinc-600 truncate">—</p>
          <span id="perfilTipo" class="inline-block mt-1.5 text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-[#F46A1F] text-white">—</span>
        </div>
      </div>
    </div>

    <!-- Conteúdo scrollável -->
    <div class="flex-grow overflow-y-auto no-scrollbar px-6 pt-5 pb-28">

      <!-- Feedback -->
      <div id="mensagemFeedback" class="hidden mb-4 p-3 rounded-2xl text-xs font-semibold"></div>

      <!-- Card de estatísticas -->
      <div id="statsCard" class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
          <p id="statLabel1" class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wide">Pets</p>
          <p id="statValue1" class="text-2xl font-extrabold text-zinc-900 mt-1">—</p>
        </div>
        <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
          <p id="statLabel2" class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wide">Solicitações</p>
          <p id="statValue2" class="text-2xl font-extrabold text-zinc-900 mt-1">—</p>
        </div>
      </div>

      <!-- Dados do perfil (editável) -->
      <div class="bg-white rounded-3xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.02)] mb-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-extrabold text-zinc-900">Dados pessoais</h2>
          <button id="btnEditar" onclick="toggleEdicao()"
            class="text-[11px] font-bold text-[#F46A1F] hover:underline cursor-pointer">Editar</button>
        </div>

        <form id="formPerfil" class="space-y-3">
          <div>
            <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">Nome</label>
            <input type="text" id="inputNome" disabled
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 px-4 py-2.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition disabled:opacity-70">
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">E-mail</label>
            <input type="email" id="inputEmail" disabled
              class="w-full bg-[#F7F6F4] text-sm text-zinc-500 px-4 py-2.5 rounded-2xl border border-transparent focus:outline-none transition disabled:opacity-70">
            <p class="text-[10px] text-zinc-400 mt-1 ml-1">O e-mail não pode ser alterado</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">Telefone</label>
              <input type="text" id="inputTelefone" disabled placeholder="(11) 99999-9999"
                class="w-full bg-[#F7F6F4] text-sm text-zinc-900 px-3 py-2.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition disabled:opacity-70">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">Tipo</label>
              <input type="text" id="inputTipo" disabled
                class="w-full bg-[#F7F6F4] text-sm text-zinc-500 px-3 py-2.5 rounded-2xl border border-transparent focus:outline-none transition disabled:opacity-70">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-2">
              <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">Cidade</label>
              <input type="text" id="inputCidade" disabled placeholder="Ex: São Paulo"
                class="w-full bg-[#F7F6F4] text-sm text-zinc-900 px-3 py-2.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition disabled:opacity-70">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-zinc-500 mb-1 ml-1 uppercase tracking-wide">UF</label>
              <input type="text" id="inputEstado" disabled maxlength="2" placeholder="SP"
                class="w-full bg-[#F7F6F4] text-sm text-zinc-900 px-3 py-2.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none uppercase text-center transition disabled:opacity-70">
            </div>
          </div>

          <div id="acoesEdicao" class="hidden pt-2 flex gap-2">
            <button type="button" onclick="toggleEdicao()"
              class="flex-1 bg-stone-100 text-zinc-700 font-bold text-xs py-2.5 rounded-full hover:bg-stone-200 transition cursor-pointer">
              Cancelar
            </button>
            <button type="submit" id="btnSalvar"
              class="flex-1 bg-[#18181B] text-white font-bold text-xs py-2.5 rounded-full hover:bg-zinc-800 transition cursor-pointer disabled:opacity-60">
              <span id="btnSalvarTexto">Salvar</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Seção dinâmica: Meus Pets (ONG/Protetor) -->
      <div id="secaoMeusPets" class="hidden mb-5">
        <div class="flex items-center justify-between mb-3 px-1">
          <h2 class="text-sm font-extrabold text-zinc-900">Meus Pets</h2>
          <button onclick="window.location.href='home.html'"
            class="text-[11px] font-bold text-[#F46A1F] hover:underline cursor-pointer">+ Novo</button>
        </div>
        <div id="listaMeusPets" class="space-y-2">
          <div class="text-center text-zinc-400 text-xs py-6">Carregando...</div>
        </div>
      </div>

      <!-- Seção dinâmica: Minhas Solicitações (Adotante) -->
      <div id="secaoSolicitacoes" class="hidden mb-5">
        <h2 class="text-sm font-extrabold text-zinc-900 mb-3 px-1">Minhas Solicitações</h2>
        <div id="listaSolicitacoes" class="space-y-2">
          <div class="text-center text-zinc-400 text-xs py-6">Carregando...</div>
        </div>
      </div>

      <!-- Botão Sair -->
      <button onclick="logout()"
        class="w-full bg-white text-red-500 font-bold text-sm py-3.5 rounded-full border border-red-100 hover:bg-red-50 transition cursor-pointer flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Sair da conta
      </button>

      <p class="text-center text-[10px] text-zinc-400 mt-4">PetPerto • v1.0</p>
    </div>

    <!-- Nav inferior (mesma do home) -->
    <div class="absolute bottom-0 inset-x-0 pb-5 px-6 flex justify-center bg-gradient-to-t from-[#F7F6F4] via-[#F7F6F4] to-transparent pt-6">
      <nav class="bg-[#18181B] p-2 rounded-full flex items-center gap-3 shadow-[0_15px_35px_rgba(24,24,27,0.28)]">
        <button onclick="window.location.href='home.html'" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </button>
        <button onclick="alert('Em breve: Acompanhe suas solicitações de adoção aqui!')" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </button>
        <button onclick="alert('Em breve: Seus favoritos aqui!')" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button class="w-12 h-12 rounded-full bg-[#F46A1F] text-white flex items-center justify-center shadow-md transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
      </nav>
    </div>

  </div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://petperto.vercel.app/api';

    const token = localStorage.getItem('petperto_token');
    let user = JSON.parse(localStorage.getItem('petperto_user') || 'null');

    if (!token || !user) {
      window.location.replace('login.html');
    }

    const feedback = document.getElementById('mensagemFeedback');
    function mostrarFeedback(msg, isErro = true) {
      feedback.textContent = msg;
      feedback.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-700');
      feedback.classList.add(isErro ? 'bg-red-50' : 'bg-emerald-50');
      feedback.classList.add(isErro ? 'text-red-600' : 'text-emerald-700');
      setTimeout(() => feedback.classList.add('hidden'), 4000);
    }

    // ============================================================
    // PREENCHE DADOS DO PERFIL
    // ============================================================
    const rotulosTipo = {
      ADOTANTE: 'Adotante',
      PROTETOR: 'Protetor',
      ONG: 'ONG',
      ADMIN: 'Administrador',
    };

    function preencherPerfil() {
      document.getElementById('perfilNome').textContent = user.nome || '—';
      document.getElementById('perfilEmail').textContent = user.email || '—';
      document.getElementById('perfilTipo').textContent = rotulosTipo[user.tipoPerfil] || user.tipoPerfil;

      document.getElementById('avatarIniciais').textContent = (user.nome || '?').charAt(0).toUpperCase();
      if (user.avatarUrl) {
        const img = document.getElementById('avatarImg');
        img.src = user.avatarUrl;
        img.classList.remove('hidden');
        document.getElementById('avatarIniciais').classList.add('hidden');
      }

      document.getElementById('inputNome').value = user.nome || '';
      document.getElementById('inputEmail').value = user.email || '';
      document.getElementById('inputTelefone').value = user.telefone || '';
      document.getElementById('inputTipo').value = rotulosTipo[user.tipoPerfil] || user.tipoPerfil;
      document.getElementById('inputCidade').value = user.cidade || '';
      document.getElementById('inputEstado').value = user.estado || '';
    }

    preencherPerfil();

    // ============================================================
    // EDIÇÃO DO PERFIL
    // ============================================================
    const camposEditaveis = ['inputNome', 'inputTelefone', 'inputCidade', 'inputEstado'];

    function toggleEdicao() {
      const editando = !document.getElementById('inputNome').disabled;
      if (editando) {
        // Cancelar → restaura valores originais
        preencherPerfil();
      }
      camposEditaveis.forEach(id => document.getElementById(id).disabled = editando);
      document.getElementById('acoesEdicao').classList.toggle('hidden', editando);
      document.getElementById('btnEditar').textContent = editando ? 'Editar' : 'Cancelar';
    }

    document.getElementById('formPerfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      const txt = document.getElementById('btnSalvarTexto');
      btn.disabled = true;
      txt.textContent = 'Salvando...';

      const payload = {
        nome: document.getElementById('inputNome').value.trim(),
        telefone: document.getElementById('inputTelefone').value.trim() || null,
        cidade: document.getElementById('inputCidade').value.trim() || null,
        estado: document.getElementById('inputEstado').value.trim().toUpperCase() || null,
      };

      try {
        const res = await fetch(`${API_URL}/auth/me`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao atualizar perfil.');

        // Atualiza localStorage + UI
        user = { ...user, ...payload };
        localStorage.setItem('petperto_user', JSON.stringify(user));
        preencherPerfil();
        toggleEdicao();
        mostrarFeedback('Perfil atualizado!', false);
      } catch (err) {
        // Fallback: se endpoint não existir (404), salva só local
        if (err.message.includes('404') || err.message.includes('not found')) {
          user = { ...user, ...payload };
          localStorage.setItem('petperto_user', JSON.stringify(user));
          preencherPerfil();
          toggleEdicao();
          mostrarFeedback('Salvo localmente (endpoint /auth/me ainda não existe no server).', false);
        } else {
          mostrarFeedback(err.message, true);
        }
      } finally {
        btn.disabled = false;
        txt.textContent = 'Salvar';
      }
    });

    // ============================================================
    // UPLOAD DE AVATAR
    // ============================================================
    function comprimirImagem(file, maxWidth = 600, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(b => b ? resolve(b) : reject(new Error('Falha')), 'image/jpeg', quality);
          };
          img.onerror = () => reject(new Error('Imagem inválida'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Falha ao ler'));
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        mostrarFeedback('Selecione uma imagem válida.', true);
        return;
      }

      try {
        mostrarFeedback('Enviando foto...', false);

        let arquivo = file;
        try {
          const blob = await comprimirImagem(file);
          arquivo = new File([blob], 'avatar.jpg', { type: 'image/jpeg' });
        } catch { /* usa original */ }

        const fd = new FormData();
        fd.append('foto', arquivo);

        const res = await fetch(`${API_URL}/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: fd
        });

        if (!res.ok) throw new Error('Falha no upload da foto.');
        const { url } = await res.json();

        // Atualiza localmente (o backend pode ter endpoint PATCH /auth/me/avatar também)
        user.avatarUrl = url;
        localStorage.setItem('petperto_user', JSON.stringify(user));

        const img = document.getElementById('avatarImg');
        img.src = url;
        img.classList.remove('hidden');
        document.getElementById('avatarIniciais').classList.add('hidden');

        mostrarFeedback('Foto atualizada!', false);
      } catch (err) {
        mostrarFeedback(err.message, true);
      }
    });

    // ============================================================
    // ESTATÍSTICAS + LISTAS
    // ============================================================
    const statusPetLabel = {
      DISPONIVEL: { txt: 'Disponível', cls: 'bg-emerald-50 text-emerald-700' },
      EM_PROCESSO: { txt: 'Em processo', cls: 'bg-amber-50 text-amber-700' },
      ADOTADO: { txt: 'Adotado', cls: 'bg-zinc-100 text-zinc-600' },
      INATIVO: { txt: 'Inativo', cls: 'bg-zinc-100 text-zinc-500' },
    };
    const statusAdocaoLabel = {
      PENDENTE: { txt: 'Pendente', cls: 'bg-amber-50 text-amber-700' },
      EM_ANALISE: { txt: 'Em análise', cls: 'bg-blue-50 text-blue-700' },
      APROVADA: { txt: 'Aprovada', cls: 'bg-emerald-50 text-emerald-700' },
      RECUSADA: { txt: 'Recusada', cls: 'bg-red-50 text-red-600' },
      CANCELADA: { txt: 'Cancelada', cls: 'bg-zinc-100 text-zinc-500' },
    };

    async function carregarEstatisticas() {
      const isDoador = user.tipoPerfil === 'ONG' || user.tipoPerfil === 'PROTETOR';

      if (isDoador) {
        document.getElementById('statLabel1').textContent = 'Pets cadastrados';
        document.getElementById('statLabel2').textContent = 'Adotados';
        document.getElementById('secaoMeusPets').classList.remove('hidden');
      } else {
        document.getElementById('statLabel1').textContent = 'Solicitações';
        document.getElementById('statLabel2').textContent = 'Aprovadas';
        document.getElementById('secaoSolicitacoes').classList.remove('hidden');
      }

      try {
        const res = await fetch(`${API_URL}/pets?`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const pets = await res.json();

        const meusPets = pets.filter(p => p.tutorId === user.id || p.tutor?.id === user.id);

        if (isDoador) {
          document.getElementById('statValue1').textContent = meusPets.length;
          document.getElementById('statValue2').textContent = meusPets.filter(p => p.status === 'ADOTADO').length;
          renderizarMeusPets(meusPets);
        } else {
          // Para adotante, busca solicitações — assumindo endpoint /adoptions/me
          try {
            const r = await fetch(`${API_URL}/adoptions/me`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (r.ok) {
              const sols = await r.json();
              document.getElementById('statValue1').textContent = sols.length;
              document.getElementById('statValue2').textContent = sols.filter(s => s.status === 'APROVADA').length;
              renderizarSolicitacoes(sols);
            } else {
              document.getElementById('statValue1').textContent = '0';
              document.getElementById('statValue2').textContent = '0';
              renderizarSolicitacoes([]);
            }
          } catch {
            document.getElementById('statValue1').textContent = '—';
            document.getElementById('statValue2').textContent = '—';
          }
        }
      } catch (err) {
        document.getElementById('statValue1').textContent = '—';
        document.getElementById('statValue2').textContent = '—';
      }
    }

    function renderizarMeusPets(pets) {
      const el = document.getElementById('listaMeusPets');
      if (!pets.length) {
        el.innerHTML = `<div class="text-center text-zinc-400 text-xs py-6 bg-white rounded-3xl">Você ainda não cadastrou pets.</div>`;
        return;
      }

      el.innerHTML = pets.map(p => {
        const foto = p.fotos?.[0];
        const fotoUrl = typeof foto === 'string' ? foto : foto?.url;
        const st = statusPetLabel[p.status] || statusPetLabel.DISPONIVEL;
        return `
          <div class="bg-white p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-stone-100 overflow-hidden shrink-0">
              ${fotoUrl ? `<img src="${fotoUrl}" class="w-full h-full object-cover" onerror="this.style.display='none'">` : '<div class="w-full h-full flex items-center justify-center text-lg">🐾</div>'}
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-zinc-900 truncate">${p.nome}</p>
              <p class="text-[11px] text-zinc-500 truncate">${p.raca || 'SRD'} • ${p.porte}</p>
            </div>
            <span class="text-[10px] font-bold px-2 py-1 rounded-full ${st.cls}">${st.txt}</span>
          </div>
        `;
      }).join('');
    }

    function renderizarSolicitacoes(sols) {
      const el = document.getElementById('listaSolicitacoes');
      if (!sols.length) {
        el.innerHTML = `<div class="text-center text-zinc-400 text-xs py-6 bg-white rounded-3xl">Nenhuma solicitação ainda.</div>`;
        return;
      }

      el.innerHTML = sols.map(s => {
        const st = statusAdocaoLabel[s.status] || statusAdocaoLabel.PENDENTE;
        const nomePet = s.pet?.nome || 'Pet';
        return `
          <div class="bg-white p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-stone-100 flex items-center justify-center text-lg shrink-0">🐾</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-zinc-900 truncate">${nomePet}</p>
              <p class="text-[11px] text-zinc-500 truncate">Solicitação de adoção</p>
            </div>
            <span class="text-[10px] font-bold px-2 py-1 rounded-full ${st.cls}">${st.txt}</span>
          </div>
        `;
      }).join('');
    }

    carregarEstatisticas();

    // ============================================================
    // LOGOUT
    // ============================================================
    function logout() {
      if (!confirm('Deseja realmente sair da conta?')) return;
      localStorage.removeItem('petperto_token');
      localStorage.removeItem('petperto_user');
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
