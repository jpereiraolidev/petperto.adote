<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - PetPerto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F6F5F3] text-[#18181B] min-h-screen flex items-center justify-center p-4">

  <!-- Container Principal (Estilo Mobile Frame / Card Central) -->
  <div class="w-full max-w-[400px] bg-white rounded-[36px] shadow-[0_20px_50px_rgba(0,0,0,0.06)] overflow-hidden border border-stone-100">
    
    <!-- Topo Decorativo inspirado no card do pet -->
    <div class="relative bg-[#EAE2D8] pt-10 pb-8 px-6 text-center overflow-hidden rounded-b-[36px]">
      <!-- Marcas d'água de patinhas -->
      <svg class="w-10 h-10 text-[#DCD0C0] absolute top-5 left-6 -rotate-12" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-4.5-1c-.83 0-1.5.67-1.5 1.5S6.67 12 7.5 12 9 11.33 9 10.5 8.33 9 7.5 9zm9 0c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5S17.33 9 16.5 9zM12 15c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
      </svg>
      <svg class="w-12 h-12 text-[#DCD0C0] absolute bottom-4 right-6 rotate-12" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-4.5-1c-.83 0-1.5.67-1.5 1.5S6.67 12 7.5 12 9 11.33 9 10.5 8.33 9 7.5 9zm9 0c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5S17.33 9 16.5 9zM12 15c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
      </svg>

      <!-- Badge / Logo -->
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white shadow-sm mb-3">
        <span class="text-3xl">🐾</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-zinc-900">PetPerto</h1>
      <p class="text-xs font-medium text-zinc-600 mt-1">Seu próximo melhor amigo está aqui</p>
    </div>

    <!-- Formulário de Login -->
    <div class="p-7">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-zinc-900">Bem-vindo de volta!</h2>
        <p class="text-sm text-zinc-400 mt-0.5">Entre na sua conta para continuar</p>
      </div>

      <!-- Alerta de Erro / Sucesso -->
      <div id="mensagemFeedback" class="hidden mb-4 p-3.5 rounded-2xl text-xs font-semibold"></div>

      <form id="loginForm" class="space-y-4">
        <!-- Campo E-mail -->
        <div>
          <label for="email" class="block text-xs font-semibold text-zinc-600 mb-1.5 ml-1">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-zinc-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="seuemail@exemplo.com"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 pl-11 pr-4 py-3.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition"
            >
          </div>
        </div>

        <!-- Campo Senha -->
        <div>
          <div class="flex justify-between items-center mb-1.5 ml-1 mr-1">
            <label for="senha" class="block text-xs font-semibold text-zinc-600">Senha</label>
            <a href="#" class="text-xs font-semibold text-[#F46A1F] hover:underline">Esqueceu?</a>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-4 flex items-center text-zinc-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input 
              type="password" 
              id="senha" 
              required 
              placeholder="••••••••"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 pl-11 pr-4 py-3.5 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition"
            >
          </div>
        </div>

        <!-- Botão de Ação -->
        <div class="pt-3">
          <button 
            type="submit" 
            id="btnEntrar"
            class="w-full bg-[#18181B] hover:bg-zinc-800 active:scale-[0.99] text-white font-semibold text-sm p-2 pl-6 rounded-full flex items-center justify-between shadow-lg shadow-zinc-900/15 transition cursor-pointer"
          >
            <span id="btnTexto">Entrar no app</span>
            <span class="w-10 h-10 rounded-full bg-[#F46A1F] flex items-center justify-center text-white shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </span>
          </button>
        </div>
      </form>

      <!-- Link para Cadastro -->
      <div class="mt-7 text-center">
        <p class="text-xs text-zinc-500">
          Ainda não tem uma conta? 
          <a href="register.html" class="font-bold text-[#F46A1F] hover:underline">Criar conta</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Integração com a API -->
  <script>
    const API_URL = 'https://petperto.vercel.app/api'; // Altere para https://petperto.vercel.app/api em produção

    // Se já estiver logado, vai direto para a home
    if (localStorage.getItem('petperto_token')) {
      window.location.replace('home.html');
    }

    const form = document.getElementById('loginForm');
    const feedback = document.getElementById('mensagemFeedback');
    const btnEntrar = document.getElementById('btnEntrar');
    const btnTexto = document.getElementById('btnTexto');

    function mostrarFeedback(mensagem, isErro = true) {
      feedback.textContent = mensagem;
      feedback.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-700');
      if (isErro) {
        feedback.classList.add('bg-red-50', 'text-red-600');
      } else {
        feedback.classList.add('bg-emerald-50', 'text-emerald-700');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      btnEntrar.disabled = true;
      btnTexto.textContent = 'Entrando...';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao fazer login.');
        }

        // Salva o token e os dados do usuário no navegador
        localStorage.setItem('petperto_token', data.token);
        localStorage.setItem('petperto_user', JSON.stringify(data.user));

        mostrarFeedback('Login realizado! Entrando...', false);

        // Redireciona imediatamente para a home
        window.location.replace('home.html');

      } catch (error) {
        mostrarFeedback(error.message, true);
        btnEntrar.disabled = false;
        btnTexto.textContent = 'Entrar no app';
      }
    });
  </script>
</body>
</html>
