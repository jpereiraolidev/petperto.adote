<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - PetPerto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#F6F5F3] text-[#18181B] min-h-screen flex items-center justify-center p-4 py-10">

  <div class="w-full max-w-[420px] bg-white rounded-[36px] shadow-[0_20px_50px_rgba(0,0,0,0.06)] overflow-hidden border border-stone-100">
    
    <!-- Topo Decorativo -->
    <div class="relative bg-[#EAE2D8] pt-8 pb-6 px-6 text-center overflow-hidden rounded-b-[36px]">
      <svg class="w-10 h-10 text-[#DCD0C0] absolute top-4 left-5 -rotate-12" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-4.5-1c-.83 0-1.5.67-1.5 1.5S6.67 12 7.5 12 9 11.33 9 10.5 8.33 9 7.5 9zm9 0c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5S17.33 9 16.5 9zM12 15c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
      </svg>
      
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white shadow-sm mb-2">
        <span class="text-2xl">🐾</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-zinc-900">PetPerto</h1>
      <p class="text-xs font-medium text-zinc-600 mt-0.5">Faça parte da nossa rede de adoção</p>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="p-6">
      <div class="mb-5">
        <h2 class="text-lg font-bold text-zinc-900">Criar sua conta</h2>
        <p class="text-xs text-zinc-400 mt-0.5">Preencha os dados abaixo para começar</p>
      </div>

      <!-- Alerta de Feedback -->
      <div id="mensagemFeedback" class="hidden mb-4 p-3 rounded-2xl text-xs font-semibold"></div>

      <form id="registerForm" class="space-y-3.5">
        <!-- Nome -->
        <div>
          <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Seu nome ou nome da ONG"
            class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-4 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
        </div>

        <!-- E-mail -->
        <div>
          <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">E-mail</label>
          <input type="email" id="email" required placeholder="seuemail@exemplo.com"
            class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-4 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
        </div>

        <!-- Senha -->
        <div>
          <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Senha</label>
          <input type="password" id="senha" required minlength="6" placeholder="Mínimo de 6 caracteres"
            class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-4 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
        </div>

        <!-- Tipo de Perfil e Telefone -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Perfil</label>
            <select id="tipoPerfil"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 px-3 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
              <option value="ADOTANTE">Adotante</option>
              <option value="ONG">ONG / Protetor</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Telefone</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-3 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
          </div>
        </div>

        <!-- Cidade e Estado -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Cidade</label>
            <input type="text" id="cidade" placeholder="Ex: São Paulo"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-3 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Estado</label>
            <input type="text" id="estado" placeholder="UF" maxlength="2"
              class="w-full bg-[#F7F6F4] text-sm text-zinc-900 placeholder-zinc-400 px-3 py-3 rounded-2xl border border-transparent focus:border-[#F46A1F] focus:bg-white focus:outline-none uppercase transition text-center">
          </div>
        </div>

        <!-- Botão de Cadastro -->
        <div class="pt-2">
          <button type="submit" id="btnCadastrar"
            class="w-full bg-[#18181B] hover:bg-zinc-800 active:scale-[0.99] text-white font-semibold text-sm p-1.5 pl-6 rounded-full flex items-center justify-between shadow-lg shadow-zinc-900/15 transition cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
            <span id="btnTexto">Cadastrar conta</span>
            <span class="w-10 h-10 rounded-full bg-[#F46A1F] flex items-center justify-center text-white shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </span>
          </button>
        </div>
      </form>

      <!-- Link para Login -->
      <div class="mt-5 text-center">
        <p class="text-xs text-zinc-500">
          Já tem uma conta?
          <a href="login.html" class="font-bold text-[#F46A1F] hover:underline">Fazer login</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÃO ÚNICA DE API
    // Troque para 'http://localhost:3000/api' em desenvolvimento local.
    // ============================================================
    const API_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:3000/api'
      : 'https://petperto.vercel.app/api';

    // Rotas padronizadas
    const ROUTES = {
      home: 'home.html',
      login: 'login.html'
    };

    // Se já estiver logado, vai direto para a home
    if (localStorage.getItem('petperto_token')) {
      window.location.replace(ROUTES.home);
    }

    const form = document.getElementById('registerForm');
    const feedback = document.getElementById('mensagemFeedback');
    const btnCadastrar = document.getElementById('btnCadastrar');
    const btnTexto = document.getElementById('btnTexto');

    function mostrarFeedback(mensagem, isErro = true) {
      feedback.textContent = mensagem;
      feedback.classList.remove(
        'hidden',
        'bg-red-50', 'text-red-600',
        'bg-emerald-50', 'text-emerald-700'
      );
      feedback.classList.add(isErro ? 'bg-red-50' : 'bg-emerald-50');
      feedback.classList.add(isErro ? 'text-red-600' : 'text-emerald-700');
    }

    function setLoading(loading) {
      btnCadastrar.disabled = loading;
      btnTexto.textContent = loading ? 'Cadastrando...' : 'Cadastrar conta';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(true);

      // Coleta + normalização dos dados
      const payload = {
        nome:     document.getElementById('nome').value.trim(),
        email:    document.getElementById('email').value.trim().toLowerCase(),
        senha:    document.getElementById('senha').value,
        tipoPerfil: document.getElementById('tipoPerfil').value,
        telefone: document.getElementById('telefone').value.trim(),
        cidade:   document.getElementById('cidade').value.trim(),
        estado:   document.getElementById('estado').value.trim().toUpperCase()
      };

      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Alguns erros de rede/servidor podem não retornar JSON
        let data = {};
        try { data = await response.json(); } catch { /* ignora corpo vazio */ }

        if (!response.ok) {
          throw new Error(data.error || data.message || `Erro ao registrar (${response.status}).`);
        }

        // Persiste sessão
        if (data.token) localStorage.setItem('petperto_token', data.token);
        if (data.user)  localStorage.setItem('petperto_user', JSON.stringify(data.user));

        mostrarFeedback('Conta criada com sucesso! Entrando no app...', false);

        // Redireciona para a home
        setTimeout(() => window.location.replace(ROUTES.home), 600);

      } catch (error) {
        mostrarFeedback(error.message || 'Erro de conexão com o servidor.', true);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
