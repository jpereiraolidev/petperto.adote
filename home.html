<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Pets - PetPerto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#EFECE8] text-[#18181B] min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-[420px] min-h-screen sm:min-h-[820px] sm:max-h-[860px] bg-[#F7F6F4] sm:rounded-[42px] shadow-[0_25px_60px_rgba(0,0,0,0.08)] flex flex-col justify-between relative overflow-hidden border border-stone-200/70">

    <!-- Topo e Filtros -->
    <div class="pt-7 px-6">
      <header class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-[#EAE2D8] flex items-center justify-center text-lg font-bold text-zinc-800 border-2 border-white shadow-sm overflow-hidden">
            <span id="userAvatarIniciais">🐾</span>
          </div>
          <div>
            <p class="text-[11px] font-medium text-zinc-400 leading-tight" id="saudacaoTexto">Bom dia!</p>
            <h1 class="text-base font-extrabold text-zinc-900 leading-tight" id="userNameDisplay">Carregando...</h1>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="btnNovoPet" onclick="abrirModalNovoPet()" title="Cadastrar novo pet"
            class="hidden w-10 h-10 rounded-full bg-[#F46A1F] text-white flex items-center justify-center shadow-md hover:bg-orange-600 transition cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </button>

          <button onclick="logout()" title="Sair da conta"
            class="w-10 h-10 rounded-full bg-white text-zinc-600 flex items-center justify-center shadow-sm border border-stone-100 hover:text-red-500 transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </header>

      <div class="flex items-center gap-2.5 mb-5">
        <div class="relative flex-grow">
          <span class="absolute inset-y-0 left-4 flex items-center text-zinc-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
            </svg>
          </span>
          <input type="text" id="searchInput" oninput="filtrarLocalmente()" placeholder="Buscar por nome ou raça..."
            class="w-full bg-white text-xs font-medium text-zinc-800 placeholder-zinc-400 pl-10 pr-4 py-3.5 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.02)] focus:outline-none focus:ring-2 focus:ring-[#F46A1F]/40 transition">
        </div>

        <button onclick="toggleFiltroPorte()" id="btnFiltroPorte"
          class="w-11 h-11 rounded-full bg-white text-zinc-700 flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:bg-zinc-50 transition cursor-pointer shrink-0 relative">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
          <span id="badgePorte" class="hidden w-2.5 h-2.5 rounded-full bg-[#F46A1F] absolute top-2 right-2"></span>
        </button>
      </div>

      <div id="menuPorte" class="hidden mb-4 bg-white p-2 rounded-2xl shadow-sm flex items-center justify-between gap-1 text-xs font-semibold">
        <button onclick="selecionarPorte('')" class="porte-opt flex-1 py-1.5 rounded-xl bg-zinc-900 text-white" data-porte="">Todos</button>
        <button onclick="selecionarPorte('PEQUENO')" class="porte-opt flex-1 py-1.5 rounded-xl text-zinc-500 hover:bg-stone-100" data-porte="PEQUENO">Pequeno</button>
        <button onclick="selecionarPorte('MEDIO')" class="porte-opt flex-1 py-1.5 rounded-xl text-zinc-500 hover:bg-stone-100" data-porte="MEDIO">Médio</button>
        <button onclick="selecionarPorte('GRANDE')" class="porte-opt flex-1 py-1.5 rounded-xl text-zinc-500 hover:bg-stone-100" data-porte="GRANDE">Grande</button>
      </div>

      <div class="flex items-center gap-2.5 overflow-x-auto no-scrollbar pb-2">
        <button onclick="selecionarEspecie('')" data-especie=""
          class="especie-pill active flex items-center gap-2 bg-[#F46A1F] text-white p-1.5 pr-4 rounded-full text-xs font-bold shadow-sm transition shrink-0 cursor-pointer">
          <span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-sm">🐾</span>
          <span>Todos</span>
        </button>
        <button onclick="selecionarEspecie('CAO')" data-especie="CAO"
          class="especie-pill flex items-center gap-2 bg-white text-zinc-700 p-1.5 pr-4 rounded-full text-xs font-bold shadow-sm transition shrink-0 cursor-pointer">
          <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=100&q=80" alt="Cães" class="w-7 h-7 rounded-full object-cover">
          <span>Cães</span>
        </button>
        <button onclick="selecionarEspecie('GATO')" data-especie="GATO"
          class="especie-pill flex items-center gap-2 bg-white text-zinc-700 p-1.5 pr-4 rounded-full text-xs font-bold shadow-sm transition shrink-0 cursor-pointer">
          <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100&q=80" alt="Gatos" class="w-7 h-7 rounded-full object-cover">
          <span>Gatos</span>
        </button>
      </div>
    </div>

    <main class="flex-grow flex flex-col items-center justify-center px-6 py-4 relative">
      <div id="deckContainer" class="relative w-full max-w-[300px] h-[390px] flex items-center justify-center">
        <div class="text-center text-zinc-400 text-xs font-medium animate-pulse">
          Buscando amigos perto de você...
        </div>
      </div>

      <div id="deckControls" class="hidden flex items-center gap-3 mt-5">
        <button onclick="petAnterior()" class="text-xs font-semibold text-zinc-400 hover:text-zinc-800 px-3 py-1.5 rounded-full bg-white shadow-sm transition cursor-pointer">← Anterior</button>
        <span id="contadorPets" class="text-[11px] font-bold text-zinc-400">1 / 1</span>
        <button onclick="proximoPet()" class="text-xs font-semibold text-zinc-400 hover:text-zinc-800 px-3 py-1.5 rounded-full bg-white shadow-sm transition cursor-pointer">Próximo →</button>
      </div>
    </main>

    <div class="pb-6 px-6 flex justify-center">
      <nav class="bg-[#18181B] p-2 rounded-full flex items-center gap-3 shadow-[0_15px_35px_rgba(24,24,27,0.28)]">
        <button onclick="carregarPets()" class="w-12 h-12 rounded-full bg-[#F46A1F] text-white flex items-center justify-center shadow-md transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </button>
        <button onclick="alert('Em breve: Acompanhe suas solicitações de adoção aqui!')" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </button>
        <button onclick="favoritarAtual()" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg id="iconHeartNav" class="w-5 h-5 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button onclick="mostrarPerfilModal()" class="w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
      </nav>
    </div>

    <!-- MODAL DETALHES PET -->
    <div id="petModal" class="hidden absolute inset-0 bg-[#F7F6F4] z-50 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="relative bg-[#EAE2D8] h-[340px] rounded-b-[40px] overflow-hidden flex items-end justify-center">
          <button onclick="fecharModalPet()" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm text-zinc-800 flex items-center justify-center shadow-sm cursor-pointer z-10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button onclick="favoritarAtual()" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm text-red-500 flex items-center justify-center shadow-sm cursor-pointer z-10">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
          <img id="modalPetFoto" src="" alt="Pet" class="w-full h-full object-cover">
        </div>

        <div class="p-6">
          <div class="flex items-baseline justify-between mb-4">
            <div>
              <h2 id="modalPetNome" class="text-2xl font-extrabold text-zinc-900">Nome do Pet</h2>
              <p id="modalPetRaca" class="text-xs font-medium text-zinc-500">Raça • Sexo</p>
            </div>
            <span id="modalPetEspecie" class="text-xs font-bold px-3 py-1 rounded-full bg-[#EAE2D8] text-zinc-800">CÃO</span>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
              <div class="flex items-center gap-2 text-zinc-400 text-xs font-semibold mb-1.5">
                <span class="w-6 h-6 rounded-full bg-stone-100 flex items-center justify-center text-zinc-600">🎂</span>
                <span>Idade</span>
              </div>
              <p id="modalPetIdade" class="text-lg font-extrabold text-zinc-900">2 anos</p>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
              <div class="flex items-center gap-2 text-zinc-400 text-xs font-semibold mb-1.5">
                <span class="w-6 h-6 rounded-full bg-stone-100 flex items-center justify-center text-zinc-600">📏</span>
                <span>Porte</span>
              </div>
              <p id="modalPetPorte" class="text-lg font-extrabold text-zinc-900">Médio</p>
            </div>
          </div>

          <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
            <h3 class="text-sm font-bold text-zinc-900 mb-1.5">Sobre</h3>
            <p id="modalPetDescricao" class="text-xs text-zinc-500 leading-relaxed">Descrição do temperamento e cuidados do pet.</p>
            <div class="flex flex-wrap gap-1.5 mt-3" id="modalPetTags"></div>
          </div>
        </div>
      </div>

      <div class="p-6 pt-2 flex items-center gap-3">
        <button id="btnSolicitarAdocao" onclick="solicitarAdocao()"
          class="flex-grow bg-white hover:bg-stone-50 text-zinc-900 font-bold text-sm p-2 pl-6 rounded-full flex items-center justify-between shadow-md border border-stone-100 transition cursor-pointer">
          <span id="textoBtnAdocao">Adotar agora</span>
          <span class="w-10 h-10 rounded-full bg-[#F46A1F] text-white flex items-center justify-center shadow-sm">🐾</span>
        </button>
      </div>
    </div>

    <!-- MODAL NOVO PET (COM UPLOAD DE ARQUIVO) -->
    <div id="novoPetModal" class="hidden absolute inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
      <div class="bg-white w-full rounded-[32px] p-6 shadow-xl max-h-[92vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-extrabold text-zinc-900">Cadastrar Pet para Adoção</h3>
          <button onclick="fecharModalNovoPet()" class="text-zinc-400 hover:text-zinc-700 font-bold text-lg cursor-pointer">✕</button>
        </div>

        <form id="formNovoPet" class="space-y-3">
          <input type="text" id="petNome" required placeholder="Nome do pet" class="w-full bg-[#F7F6F4] text-sm px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#F46A1F]">

          <div class="grid grid-cols-2 gap-2">
            <select id="petEspecie" class="bg-[#F7F6F4] text-sm px-3 py-3 rounded-2xl">
              <option value="CAO">Cachorro</option>
              <option value="GATO">Gato</option>
              <option value="OUTRO">Outro</option>
            </select>
            <select id="petPorte" class="bg-[#F7F6F4] text-sm px-3 py-3 rounded-2xl">
              <option value="PEQUENO">Pequeno</option>
              <option value="MEDIO">Médio</option>
              <option value="GRANDE">Grande</option>
            </select>
          </div>

          <!-- NOVO: Sexo (obrigatório no schema Prisma) -->
          <div class="grid grid-cols-2 gap-2">
            <select id="petSexo" class="bg-[#F7F6F4] text-sm px-3 py-3 rounded-2xl">
              <option value="MACHO">Macho</option>
              <option value="FEMEA">Fêmea</option>
            </select>
            <input type="text" id="petRaca" placeholder="Raça (ex: SRD)" class="bg-[#F7F6F4] text-sm px-4 py-3 rounded-2xl">
          </div>

          <input type="text" id="petIdade" placeholder="Idade (ex: 2 anos)" class="w-full bg-[#F7F6F4] text-sm px-4 py-3 rounded-2xl">

          <!-- === UPLOAD DE IMAGEM DO PC === -->
          <div>
            <label for="petFoto" class="block text-xs font-semibold text-zinc-600 mb-1 ml-1">Foto do Pet (do seu computador)</label>
            <input
              type="file"
              id="petFoto"
              name="foto"
              accept="image/png,image/jpeg,image/webp,image/gif"
              class="w-full text-xs text-zinc-600 bg-[#F7F6F4] file:mr-3 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:bg-[#18181B] file:text-white file:font-semibold file:cursor-pointer hover:file:bg-zinc-800 px-2 py-1.5 rounded-2xl"
            >
            <p class="text-[10px] text-zinc-400 mt-1 ml-1">PNG, JPG, WEBP ou GIF • máx. 5MB (comprimimos antes de enviar)</p>

            <div id="previewContainer" class="hidden mt-2">
              <img id="previewImg" src="" alt="Preview" class="w-full h-40 object-cover rounded-2xl border border-stone-200">
            </div>
          </div>

          <textarea id="petDescricao" rows="2" placeholder="Conte um pouco sobre o temperamento..." class="w-full bg-[#F7F6F4] text-sm px-4 py-3 rounded-2xl"></textarea>

          <button type="submit" id="btnPublicarPet"
            class="w-full bg-[#18181B] text-white font-bold text-sm py-3.5 rounded-full hover:bg-zinc-800 transition cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
            <span id="btnPublicarTexto">Publicar Pet</span>
          </button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÃO DE PRODUÇÃO
    // ============================================================
    const API_URL = 'https://petperto.vercel.app/api';

    // 1. Autenticação
    const token = localStorage.getItem('petperto_token');
    const user = JSON.parse(localStorage.getItem('petperto_user') || 'null');

    if (!token || !user) {
      window.location.replace('login.html');
    }

    document.getElementById('userNameDisplay').textContent = user.nome;
    document.getElementById('userAvatarIniciais').textContent = user.nome.charAt(0).toUpperCase();

    const hora = new Date().getHours();
    document.getElementById('saudacaoTexto').textContent =
      hora < 12 ? 'Bom dia!' : hora < 18 ? 'Boa tarde!' : 'Boa noite!';

    if (user.tipoPerfil === 'ONG' || user.tipoPerfil === 'PROTETOR') {
      document.getElementById('btnNovoPet').classList.remove('hidden');
    }

    // Estado
    let todosPets = [];
    let petsFiltrados = [];
    let indiceAtual = 0;
    let especieSelecionada = '';
    let porteSelecionado = '';

    const cardColors = ['bg-[#8C9B76]', 'bg-[#F5A669]', 'bg-[#B57B52]'];

    const fallbackFotos = {
      CAO: 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600&q=80',
      GATO: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80'
    };

    // Helper para resolver foto (array de objetos {url} ou strings)
    function resolverFoto(pet) {
      const f = pet.fotos && pet.fotos[0];
      if (!f) return fallbackFotos[pet.especie] || fallbackFotos.CAO;
      return typeof f === 'string' ? f : (f.url || f.caminho || fallbackFotos[pet.especie] || fallbackFotos.CAO);
    }

    // 2. Busca pets
    async function carregarPets() {
      let url = `${API_URL}/pets?`;
      if (especieSelecionada) url += `especie=${especieSelecionada}&`;
      if (porteSelecionado) url += `porte=${porteSelecionado}&`;

      try {
        const res = await fetch(url);
        todosPets = await res.json();
        filtrarLocalmente();
      } catch (err) {
        document.getElementById('deckContainer').innerHTML = `
          <div class="text-center p-6 bg-white rounded-3xl shadow-sm">
            <p class="text-sm font-bold text-red-500 mb-1">Erro de conexão</p>
            <p class="text-xs text-zinc-400">Tente novamente em instantes.</p>
          </div>
        `;
      }
    }

    function filtrarLocalmente() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      petsFiltrados = todosPets.filter(p =>
        p.nome.toLowerCase().includes(termo) ||
        (p.raca && p.raca.toLowerCase().includes(termo))
      );
      indiceAtual = 0;
      renderizarDeck();
    }

    // 3. Deck
    function renderizarDeck() {
      const container = document.getElementById('deckContainer');
      const controls = document.getElementById('deckControls');

      if (petsFiltrados.length === 0) {
        controls.classList.add('hidden');
        container.innerHTML = `
          <div class="text-center p-8 bg-white rounded-[32px] shadow-sm border border-stone-100">
            <span class="text-4xl block mb-2">🐶</span>
            <p class="text-sm font-bold text-zinc-800">Nenhum pet encontrado</p>
            <p class="text-xs text-zinc-400 mt-1">Tente limpar os filtros ou volte mais tarde.</p>
          </div>
        `;
        return;
      }

      controls.classList.remove('hidden');
      document.getElementById('contadorPets').textContent = `${indiceAtual + 1} / ${petsFiltrados.length}`;

      const pilha = [];
      for (let i = 0; i < Math.min(3, petsFiltrados.length); i++) {
        const idx = (indiceAtual + i) % petsFiltrados.length;
        pilha.push({ pet: petsFiltrados[idx], camada: i });
      }

      container.innerHTML = pilha.reverse().map(({ pet, camada }) => {
        const foto = resolverFoto(pet);
        const corFundo = cardColors[(indiceAtual + camada) % cardColors.length];

        let transformClass = 'rotate-0 scale-100 z-30 shadow-xl';
        if (camada === 1) transformClass = 'rotate-[7deg] translate-x-3 -translate-y-1 scale-95 z-20 opacity-90';
        if (camada === 2) transformClass = '-rotate-[6deg] -translate-x-3 -translate-y-2 scale-90 z-10 opacity-75';

        return `
          <div onclick="${camada === 0 ? `abrirModalPet('${pet.id}')` : 'proximoPet()'}"
            class="absolute inset-0 ${corFundo} rounded-[34px] overflow-hidden transition-all duration-300 cursor-pointer select-none ${transformClass}">
            <img src="${foto}" alt="${pet.nome}" class="w-full h-full object-cover" onerror="this.src='${fallbackFotos.CAO}'">
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent p-5 pt-14 flex items-end justify-between">
              <div class="text-white">
                <h2 class="text-xl font-extrabold leading-tight">${pet.nome}</h2>
                <p class="text-xs text-white/80 font-medium">${pet.raca || 'SRD'} • ${pet.idadeEstimada || 'Jovem'}</p>
              </div>
              <span class="w-11 h-11 rounded-full bg-white text-zinc-900 flex items-center justify-center shadow-md shrink-0 hover:scale-105 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function proximoPet() {
      if (petsFiltrados.length <= 1) return;
      indiceAtual = (indiceAtual + 1) % petsFiltrados.length;
      renderizarDeck();
    }
    function petAnterior() {
      if (petsFiltrados.length <= 1) return;
      indiceAtual = (indiceAtual - 1 + petsFiltrados.length) % petsFiltrados.length;
      renderizarDeck();
    }

    // 4. Filtros
    function selecionarEspecie(especie) {
      especieSelecionada = especie;
      document.querySelectorAll('.especie-pill').forEach(btn => {
        if (btn.dataset.especie === especie) {
          btn.classList.remove('bg-white', 'text-zinc-700');
          btn.classList.add('bg-[#F46A1F]', 'text-white');
        } else {
          btn.classList.remove('bg-[#F46A1F]', 'text-white');
          btn.classList.add('bg-white', 'text-zinc-700');
        }
      });
      carregarPets();
    }

    function toggleFiltroPorte() {
      document.getElementById('menuPorte').classList.toggle('hidden');
    }

    function selecionarPorte(porte) {
      porteSelecionado = porte;
      document.getElementById('badgePorte').classList.toggle('hidden', !porte);
      document.querySelectorAll('.porte-opt').forEach(btn => {
        if (btn.dataset.porte === porte) {
          btn.classList.add('bg-zinc-900', 'text-white');
          btn.classList.remove('text-zinc-500');
        } else {
          btn.classList.remove('bg-zinc-900', 'text-white');
          btn.classList.add('text-zinc-500');
        }
      });
      carregarPets();
    }

    // 5. Modal detalhes
    let petSelecionadoModal = null;

    function abrirModalPet(id) {
      const pet = petsFiltrados.find(p => p.id === id);
      if (!pet) return;
      petSelecionadoModal = pet;

      document.getElementById('modalPetFoto').src = resolverFoto(pet);
      document.getElementById('modalPetNome').textContent = pet.nome;
      document.getElementById('modalPetRaca').textContent = `${pet.raca || 'SRD'} • ${pet.sexo || 'Não informado'}`;
      document.getElementById('modalPetEspecie').textContent = pet.especie === 'GATO' ? 'Gato' : pet.especie === 'CAO' ? 'Cachorro' : 'Outro';
      document.getElementById('modalPetIdade').textContent = pet.idadeEstimada || 'Não inf.';
      document.getElementById('modalPetPorte').textContent = pet.porte;
      document.getElementById('modalPetDescricao').textContent = pet.descricaoTemperamento || 'Muito dócil, carinhoso e pronto para ganhar um novo lar cheio de amor.';

      const tags = [];
      if (pet.vacinado) tags.push('Vacinado');
      if (pet.castrado) tags.push('Castrado');
      if (pet.vermifugado) tags.push('Vermifugado');

      document.getElementById('modalPetTags').innerHTML = tags.map(t =>
        `<span class="text-[11px] font-semibold bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full">✓ ${t}</span>`
      ).join('');

      document.getElementById('textoBtnAdocao').textContent = user.tipoPerfil === 'ADOTANTE' ? 'Adotar agora' : 'Visualização';
      document.getElementById('petModal').classList.remove('hidden');
    }

    function fecharModalPet() {
      document.getElementById('petModal').classList.add('hidden');
    }

    async function solicitarAdocao() {
      if (!petSelecionadoModal) return;
      if (user.tipoPerfil !== 'ADOTANTE') {
        alert('Apenas contas de Adotante podem enviar solicitações de adoção.');
        return;
      }

      const btn = document.getElementById('btnSolicitarAdocao');
      const txt = document.getElementById('textoBtnAdocao');
      btn.disabled = true;
      txt.textContent = 'Enviando pedido...';

      try {
        const res = await fetch(`${API_URL}/pets/${petSelecionadoModal.id}/adopt`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            formularioRespostas: { interesse: 'Adotante interessado pelo app PetPerto' }
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao solicitar adoção.');

        alert(`🐾 Solicitação enviada com sucesso para adotar ${petSelecionadoModal.nome}! A ONG entrará em contato.`);
        fecharModalPet();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        txt.textContent = 'Adotar agora';
      }
    }

    // 6. Modal novo pet
    function abrirModalNovoPet() {
      document.getElementById('novoPetModal').classList.remove('hidden');
    }
    function fecharModalNovoPet() {
      document.getElementById('novoPetModal').classList.add('hidden');
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('petFoto').value = '';
    }

    // ============================================================
    // COMPRESSÃO DE IMAGEM NO FRONT (reduz antes de enviar)
    // ============================================================
    function comprimirImagem(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => (blob ? resolve(blob) : reject(new Error('Falha ao comprimir'))),
              'image/jpeg',
              quality
            );
          };
          img.onerror = () => reject(new Error('Imagem inválida'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
        reader.readAsDataURL(file);
      });
    }

    // Preview da imagem selecionada
    document.getElementById('petFoto').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById('previewContainer');
      const img = document.getElementById('previewImg');

      if (!file) {
        preview.classList.add('hidden');
        return;
      }

      const tiposPermitidos = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
      if (!tiposPermitidos.includes(file.type)) {
        alert('Formato inválido. Use PNG, JPG, WEBP ou GIF.');
        e.target.value = '';
        preview.classList.add('hidden');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        alert('Imagem muito grande. Máximo 5MB.');
        e.target.value = '';
        preview.classList.add('hidden');
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        img.src = ev.target.result;
        preview.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });

    // ============================================================
    // UPLOAD + CRIAÇÃO DO PET
    // 1) Comprime imagem no front
    // 2) Envia para /upload (server salva e devolve URL ou data URI)
    // 3) Cria pet com fotos: [url]
    // ============================================================
    document.getElementById('formNovoPet').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnPublicarPet');
      const btnTxt = document.getElementById('btnPublicarTexto');
      const arquivoOriginal = document.getElementById('petFoto').files[0];

      btn.disabled = true;
      btnTxt.textContent = 'Publicando...';

      try {
        let fotoUrl = '';

        // Passo 1: comprime e faz upload (se houver arquivo)
        if (arquivoOriginal) {
          let arquivoParaEnviar = arquivoOriginal;
          try {
            const blobComprimido = await comprimirImagem(arquivoOriginal);
            arquivoParaEnviar = new File([blobComprimido], 'pet.jpg', { type: 'image/jpeg' });
          } catch (compressErr) {
            console.warn('Falha ao comprimir, enviando original:', compressErr);
          }

          const fd = new FormData();
          fd.append('foto', arquivoParaEnviar);

          const uploadRes = await fetch(`${API_URL}/upload`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: fd
          });

          if (uploadRes.ok) {
            const uploadData = await uploadRes.json();
            fotoUrl = uploadData.url || uploadData.fotoUrl || uploadData.caminho || '';
          } else if (uploadRes.status !== 404) {
            const errData = await uploadRes.json().catch(() => ({}));
            throw new Error(errData.error || `Falha no upload (${uploadRes.status}).`);
          }
          // Se 404 → endpoint não existe ainda, segue sem foto
        }

        // Passo 2: cria o pet
        const payload = {
          nome: document.getElementById('petNome').value.trim(),
          especie: document.getElementById('petEspecie').value,
          porte: document.getElementById('petPorte').value,
          sexo: document.getElementById('petSexo').value, // ✅ obrigatório no schema
          raca: document.getElementById('petRaca').value.trim() || 'SRD',
          idadeEstimada: document.getElementById('petIdade').value.trim() || '1 ano',
          descricaoTemperamento: document.getElementById('petDescricao').value.trim(),
          fotos: fotoUrl ? [fotoUrl] : [],
          vacinado: true,
          castrado: true,
        };

        const res = await fetch(`${API_URL}/pets`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao cadastrar pet.');

        fecharModalNovoPet();
        e.target.reset();
        carregarPets();
        alert('🐾 Pet publicado com sucesso!');
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btnTxt.textContent = 'Publicar Pet';
      }
    });

    function favoritarAtual() {
      const icon = document.getElementById('iconHeartNav');
      icon.classList.toggle('text-[#F46A1F]');
      icon.classList.toggle('fill-[#F46A1F]');
    }

    function mostrarPerfilModal() {
      window.location.href = 'profile.html';
    }

    function logout() {
      localStorage.removeItem('petperto_token');
      localStorage.removeItem('petperto_user');
      window.location.replace('login.html');
    }

    carregarPets();
  </script>
</body>
